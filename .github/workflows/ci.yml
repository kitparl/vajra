name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          input: contracts
          lint: true
          format: false
          # On pull requests, fail if a proto change breaks wire compatibility with main.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main,subdir=contracts
          push: false

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/**/pom.xml
      - name: Build and test (unit + Testcontainers integration tests)
        working-directory: services
        run: mvn -B verify

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          working-directory: services
          enable-cache: true
      - name: Install
        working-directory: services
        run: uv sync --frozen
      - name: Lint
        working-directory: services
        run: |
          uv run --frozen ruff check . ../contracts/python
          uv run --frozen ruff format --check . ../contracts/python
      - name: Test
        working-directory: services
        run: uv run --frozen pytest -q

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use example env
        run: cp infra/compose/.env.example infra/compose/.env
      - name: Validate compose files
        run: scripts/compose.sh config -q
      - name: Start Postgres
        run: scripts/compose.sh up -d --wait postgres
      - name: Role isolation test
        run: infra/postgres/test/role-isolation.sh
