syntax = "proto3";

package vajra.events.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.vajra.contracts.events.v1";

// Emitted for every fill of an order. All decimals are strings.
message FillCreated {
  string fill_id = 1;
  string order_id = 2;
  string venue = 3;
  string symbol = 4;
  string side = 5;
  string price = 6;
  int64 size = 7;
  string fee = 8;
  string liquidity = 9;
  google.protobuf.Timestamp filled_at = 10;
}
