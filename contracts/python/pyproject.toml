[project]
name = "vajra-contracts"
version = "0.1.0"
description = "Python classes generated from contracts/proto at build time (never committed)."
requires-python = "==3.14.*"
dependencies = ["protobuf==7.36.2"]

[build-system]
requires = ["hatchling==1.33.0", "grpcio-tools==1.85.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only generated code ships; the build hook writes it into build/gen.
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
# Same lint/format rules as the services workspace.
extend = "../../services/pyproject.toml"

[tool.uv]
# Rebuild (re-run protoc) whenever a .proto or the build hook changes, not only when this file changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "../proto/**/*.proto" }]
