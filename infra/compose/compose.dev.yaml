# Local dev override: publishes ports to the laptop only (127.0.0.1, not the LAN).
# Postgres/Redis use 15432/16379 so they do not clash with LifeOS dev (5432/6379) on the same laptop.
services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]
  redis:
    ports: ["127.0.0.1:16379:6379"]
  gateway-bff:
    ports: ["127.0.0.1:8080:8080"]
  core-service:
    ports: ["127.0.0.1:8081:8081"]
  risk-service:
    ports: ["127.0.0.1:8082:8082"]
  signal-service:
    ports: ["127.0.0.1:8091:8091"]
  research-service:
    ports: ["127.0.0.1:8092:8092"]
