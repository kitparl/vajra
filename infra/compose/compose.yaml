# Base stack, reused on the VPS later (0014). Only ui publishes a port (127.0.0.1:8088); scripts/check-compose-ports.sh enforces it.
# Memory limits are the 0014 budget; check with scripts/check-memory.sh.
name: vajra

x-java-health: &java-health
  test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/actuator/health | grep -q UP"]
  interval: 10s
  timeout: 3s
  retries: 18

x-python-health: &python-health
  test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen('http://localhost:' + os.environ['PORT'] + '/health', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 18

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: vajra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD}
      SIGNAL_DB_PASSWORD: ${SIGNAL_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      # TCP, not the unix socket: during first-time init the temporary server answers on the socket
      # before the init script has created roles and schemas.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d vajra"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: ${KAFKA_IMAGE}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Without this the apache/kafka image writes to /tmp and topics are lost on container recreate.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx320m -Xms320m
    volumes:
      - kafkadata:/var/lib/kafka/data
    mem_limit: 768m  # measured: anon 426 MiB, hit 512m limit 51x (slice 5); see 0027
    restart: unless-stopped
    healthcheck:
      # Plain TCP probe: a kafka-*.sh probe would start a second JVM inside the 512 MB limit.
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: creates topics (auto-create is off). Nothing depends on it, so a Kafka outage never blocks services.
  kafka-init:
    image: ${KAFKA_IMAGE}
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ../kafka/create-topics.sh:/create-topics.sh:ro
    depends_on: { kafka: { condition: service_healthy } }
    mem_limit: 256m
    restart: "no"

  redis:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  core-service:
    build: { context: ../.., dockerfile: services/java.Dockerfile, args: { SERVICE: brahma } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vajra
      DB_USER: core_svc
      DB_PASSWORD: ${CORE_DB_PASSWORD}
      PORT: 8081
      RISK_BASE_URL: http://risk-service:8082
      RISK_API_TOKEN: ${RISK_API_TOKEN}
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN}
      KAFKA_BOOTSTRAP: kafka:9092
      TRADING_MODE: ${TRADING_MODE:-PAPER}
      DELTA_TESTNET_API_KEY: ${DELTA_TESTNET_API_KEY:-}
      DELTA_TESTNET_API_SECRET: ${DELTA_TESTNET_API_SECRET:-}
    depends_on: { postgres: { condition: service_healthy } }
    mem_limit: 384m
    restart: unless-stopped
    healthcheck: *java-health

  risk-service:
    build: { context: ../.., dockerfile: services/java.Dockerfile, args: { SERVICE: maryada } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vajra
      DB_USER: risk_svc
      DB_PASSWORD: ${RISK_DB_PASSWORD}
      PORT: 8082
      RISK_API_TOKEN: ${RISK_API_TOKEN}
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN}
      CORE_BASE_URL: http://core-service:8081
    depends_on: { postgres: { condition: service_healthy } }
    mem_limit: 384m
    restart: unless-stopped
    healthcheck: *java-health

  gateway-bff:
    build: { context: ../.., dockerfile: services/java.Dockerfile, args: { SERVICE: dvara } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vajra
      DB_USER: gateway_svc
      DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      PORT: 8080
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME}
      GATEWAY_ADMIN_PASSWORD_HASH: ${GATEWAY_ADMIN_PASSWORD_HASH}
      GATEWAY_COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-true}
      CORE_BASE_URL: http://core-service:8081
      RISK_BASE_URL: http://risk-service:8082
      RISK_API_TOKEN: ${RISK_API_TOKEN}
      KAFKA_BOOTSTRAP: kafka:9092
      GATEWAY_UI_ORIGIN: ${GATEWAY_UI_ORIGIN:-http://localhost:8088}
    # No kafka dependency: the gateway must start (and serve REST) while Kafka is down; the consumer keeps retrying.
    depends_on: { postgres: { condition: service_healthy } }
    mem_limit: 384m
    restart: unless-stopped
    healthcheck: *java-health

  # Only published port in the stack; Tailscale serve fronts it on the VPS. Non-root nginx, read-only rootfs.
  ui:
    build: { context: ../../ui, dockerfile: Dockerfile }
    ports: ["127.0.0.1:8088:8080"]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /run]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: { gateway-bff: { condition: service_healthy } }
    mem_limit: 32m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 18

  signal-service:
    build: { context: ../.., dockerfile: services/python.Dockerfile, args: { SERVICE: shankha, PACKAGE: signal-service, MODULE: signal_service, PORT: 8091 } }
    environment:
      DB_URL: postgresql+psycopg://postgres:5432/vajra
      DB_USER: signal_svc
      DB_PASSWORD: ${SIGNAL_DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      TRADING_MODE: ${TRADING_MODE:-PAPER}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-900}
      STRATEGY: ${STRATEGY:-sma_cross}
      SMA_FAST: ${SMA_FAST:-20}
      SMA_SLOW: ${SMA_SLOW:-60}
      SMA_SYMBOL: ${SMA_SYMBOL:-BTCUSD}
      CORE_BASE_URL: http://core-service:8081
    depends_on: { postgres: { condition: service_healthy } }
    mem_limit: 256m
    restart: unless-stopped
    healthcheck: *python-health

  # research-service runs on the laptop only (0014): scripts/compose.sh --profile research up -d research-service
  research-service:
    profiles: ["research"]
    build: { context: ../.., dockerfile: services/python.Dockerfile, args: { SERVICE: manthan, PACKAGE: research-service, MODULE: research_service, PORT: 8092 } }
    environment:
      DB_URL: postgresql+psycopg://postgres:5432/vajra
      DB_USER: research_svc
      DB_PASSWORD: ${RESEARCH_DB_PASSWORD}
      CORE_BASE_URL: http://core-service:8081
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck: *python-health

volumes:
  pgdata:
  kafkadata:
