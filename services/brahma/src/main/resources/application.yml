spring:
  application:
    name: core-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    schemas: core
    default-schema: core

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health

vajra:
  marketdata:
    # Symbols that get quotes, candles and (later) trading. Others are stored in the instrument master only.
    symbols: BTCUSD,ETHUSD
  trading:
    # PAPER (default) or DELTA_TESTNET. There is no testnet trading venue yet: non-paper orders are rejected.
    mode: ${TRADING_MODE:PAPER}
  risk:
    # Every order is approved by risk-service. Startup fails if the token is blank.
    base-url: ${RISK_BASE_URL:http://localhost:8082}
    api-token: ${RISK_API_TOKEN:}
  internal:
    # risk-service sends this on /internal/** (kill switch). Startup fails if it is blank.
    token: ${CORE_INTERNAL_TOKEN:}
