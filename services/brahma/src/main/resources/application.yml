spring:
  application:
    name: core-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      group-id: core-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 50
      properties:
        # Small fetches: core-service has a 384 MiB limit and signals are tiny and rare.
        max.partition.fetch.bytes: 262144
        fetch.max.bytes: 1048576
    listener:
      ack-mode: manual
      concurrency: 1
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    schemas: core
    default-schema: core

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health

vajra:
  signals:
    # false stops the signal.generated consumer from starting (tests, or a deliberate pause).
    enabled: ${SIGNALS_ENABLED:true}
  outbox:
    batch-size: 100
    interval: 1s
  marketdata:
    # Symbols that get quotes, candles and (later) trading. Others are stored in the instrument master only.
    symbols: BTCUSD,ETHUSD
  trading:
    # PAPER (default) or DELTA_TESTNET. There is no testnet trading venue yet: non-paper orders are rejected.
    mode: ${TRADING_MODE:PAPER}
  delta:
    # Testnet credentials, env only. Required only when TRADING_MODE=DELTA_TESTNET. Never commit or log them.
    api-key: ${DELTA_TESTNET_API_KEY:}
    api-secret: ${DELTA_TESTNET_API_SECRET:}
  risk:
    # Every order is approved by risk-service. Startup fails if the token is blank.
    base-url: ${RISK_BASE_URL:http://localhost:8082}
    api-token: ${RISK_API_TOKEN:}
  internal:
    # risk-service sends this on /internal/** (kill switch). Startup fails if it is blank.
    token: ${CORE_INTERNAL_TOKEN:}
