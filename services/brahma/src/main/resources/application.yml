spring:
  application:
    name: brahma
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    schemas: core
    default-schema: core

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health

vajra:
  marketdata:
    # Symbols that get quotes, candles and (later) trading. Others are stored in the instrument master only.
    symbols: BTCUSD,ETHUSD
