spring:
  application:
    name: risk-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    schemas: risk
    default-schema: risk

vajra:
  security:
    risk-api-token: ${RISK_API_TOKEN:}
    core-internal-token: ${CORE_INTERNAL_TOKEN:}
  core:
    base-url: ${CORE_BASE_URL:http://localhost:8081}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
