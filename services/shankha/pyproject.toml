[project]
name = "signal-service"
version = "0.1.0"
description = "signal-service: runs strategies and promoted models, publishes signals (schema signal)."
requires-python = "==3.14.*"
dependencies = [
    "vajra-common",
    "vajra-contracts",
    "vajra-strategies",
    "uvicorn==0.54.0",
    "aiokafka==0.15.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
vajra-common = { workspace = true }
vajra-strategies = { workspace = true }
vajra-contracts = { path = "../../contracts/python" }
