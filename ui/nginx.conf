# Runs as the non-root "nginx" user on 8080. Writable paths are all under /tmp (tmpfs in compose, read_only rootfs).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 1m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Trust the proto set by the Tailscale serve front (this container is only reachable through it).
  map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https https;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    # Docker DNS; the variable below makes nginx resolve the gateway at request time, so a
    # gateway recreate (new IP) does not leave a stale upstream and a missing gateway does not block startup.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway-bff:8080;

    # The SPA shell must never be cached, so a deploy is picked up immediately.
    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    # Hashed build output (main-XXXXXXXX.js, styles-XXXXXXXX.css): safe to cache forever.
    location ~ "-[A-Za-z0-9]{8}\.(js|css)$" {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # A missing script/stylesheet must be a 404, not the SPA shell.
    location ~* \.(js|css)$ {
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
      gzip off; # BREACH: no compression of authenticated responses
      proxy_pass $gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      # Our headers (server level) win; Set-Cookie is passed through untouched.
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Permissions-Policy;
    }

    location = /ws {
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Permissions-Policy;
    }
  }
}
